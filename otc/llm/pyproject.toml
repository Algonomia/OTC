[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otc-llm"
version = "0.1.0"
description = "LLM microservice for extracting OTC transfer-pricing obligation data from regulatory text and PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Algonomia - Zhengxiao YING", email = "zhengxiao.ying@algonomia.com" },
]
maintainers = [
    { name = "Algonomia - Yannick XU", email = "yannick.xu@algonomia.com" },
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
