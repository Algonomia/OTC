<app-label #label [color_theme]="color_theme"
           [border_theme]="border_theme"
           [font_theme]="weight"
           [height]="height"
           [all_icon_display_on_hover]="false">

    <ng-container *ngTemplateOutlet="label.AlgoIconTemplate; context: {icon_class: 'left-icon-light', path: 'System/Data/Map' }"></ng-container>
    <ng-container *ngTemplateOutlet="label.TextTemplate; context: { text: 'AngularSdk.CoreCommon.AllCountries' }"></ng-container>
</app-label>
