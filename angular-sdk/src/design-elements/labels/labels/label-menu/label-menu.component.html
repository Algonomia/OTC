<app-label class="cursor-pointer" #label [color_theme]="color_theme" [border_theme]="border_theme" [font_theme]="weight" [height]="height" [all_icon_display_on_hover]="false" [set_open_label_element]="is_open">
    @if (!!is_open) {
        <ng-container *ngTemplateOutlet="label.AlgoIconTemplate; context: {icon_class: 'icon-light', path: 'Action/Charet/ChevronDown' }"></ng-container>
    }
    @if (!is_open) {
        <ng-container *ngTemplateOutlet="label.AlgoIconTemplate; context: {icon_class: 'icon-light', path: 'Action/Charet/ChevronRight' }"></ng-container>
    }

    <ng-container *ngTemplateOutlet="label.TextTemplate; context: { text: text }"></ng-container>

    @if (symbol) {
        <ng-container *ngTemplateOutlet="label.SymbolTemplate; context: { symbol: symbol }"></ng-container>
    }
</app-label>
