<app-button btnCssClass="btn-main-0"
            [leftIcon]="text && icon && left_icon ? icon : ''"
            [singleIcon]="icon && !text ? icon : ''"
            [rightIcon]="icon && text && !left_icon ? icon : ''"
            [text]="text"
            [disabled]="disabled_btn"
            [size_theme]="size_theme"
            [rounded]="rounded">
</app-button>
